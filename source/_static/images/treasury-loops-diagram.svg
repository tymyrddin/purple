<polygon id="head-u5" points="421.8,154.7 410.5,162.9 408.0,153.2" fill="#000000"/>
<g id="mark-u5" transform="rotate(-37.5 361.3 184.7)"><rect x="354.8" y="178.2" width="13" height="13" fill="#ffffff" stroke="#000000" stroke-width="1.5"/></g>

<!-- loop badge R (clockwise) -->
<path id="loop-R" d="M 467.5 361.65 A 25 25 0 1 1 492.5 361.65" fill="none" stroke="#d81e1e" stroke-width="1.5"/>
<polygon id="loop-head-R" points="492.5,361.65 503.76,355.15 506.26,359.48" fill="#d81e1e"/>
<text id="loop-letter-R" x="480" y="347" font-size="22" text-anchor="middle" fill="#d81e1e">R</text>

<!-- grey open branches -->
<path id="edge-v1" d="M 819.3 187.8 Q 785.5 241.2 743.1 249.0" fill="none" stroke="#8c8c8c" stroke-width="1.5"/>
<polygon id="head-v1" points="743.1,249.0 755.0,241.7 756.8,251.6" fill="#8c8c8c"/>
<g id="mark-v1" transform="rotate(141.2 783.4 229.8)"><rect x="776.9" y="223.3" width="13" height="13" fill="#8c8c8c" stroke="#8c8c8c" stroke-width="1.5"/></g>

<path id="edge-v2" d="M 761.8 547.7 Q 726.5 564.7 683.3 537.3" fill="none" stroke="#8c8c8c" stroke-width="1.5"/>
<polygon id="head-v2" points="683.3,537.3 697.0,540.0 691.6,548.5" fill="#8c8c8c"/>
<g id="mark-v2" transform="rotate(-172.5 724.5 553.6)"><rect x="718.0" y="547.1" width="13" height="13" fill="#ffffff" stroke="#8c8c8c" stroke-width="1.5"/></g>

<!-- notes -->
<text id="note-1" x="52" y="660" font-size="12.5" fill="#000000">One reinforcing circuit, marked R: the revenue returns to the condition that produced it.</text>
<text id="note-2" x="52" y="677" font-size="12.5" fill="#000000">It closes at aggregate state finance. The income and weapons-funding edges rest on UN Panel assessments,</text>
<text id="note-3" x="52" y="694" font-size="12.5" fill="#000000">not figures the Panel derived, so the circuit is drawn no harder than the record. Grey branches feed the loop without returning to it.</text>

