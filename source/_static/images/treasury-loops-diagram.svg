<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 798" font-family="Helvetica, Arial, sans-serif">
<title>The finance of the North Korean state as a reinforcing loop</title>
<desc>A reinforcing loop in the finance of the North Korean state. Sanctions cut the state's access to foreign currency, cyber operations restore it, the revenue funds the weapons programme, and the programme's continuation is what draws the sanctions, closing the circuit. Marked R, one reinforcing loop, held at the level of aggregate state finance rather than traceable transactions. Drawn in grey, meaning a sourced effect on a branch with no evidenced return into the loop: self-reliance policy (juche), and the supply of trained operators. An increase in sanctions on the DPRK lowers access to foreign currency. An increase in access to foreign currency lowers illicit cyber revenue operations, by human intervention. An increase in illicit cyber revenue operations raises state hard-currency income. An increase in state hard-currency income raises the nuclear and missile programme. An increase in the nuclear and missile programme raises sanctions on the DPRK, by human intervention. An increase in self-reliance policy (juche) lowers access to foreign currency, by human intervention. An increase in the supply of trained operators raises illicit cyber revenue operations, by human intervention.</desc>
<rect id="background" x="0" y="0" width="960" height="798" fill="#ffffff"/>
<text id="title" x="480" y="38" font-size="20" text-anchor="middle" fill="#000000">Fiscal policy conducted by other means</text>
<text id="subtitle" x="480" y="60" font-size="13" text-anchor="middle" fill="#000000">One reinforcing loop: revenue returns to the survival it buys</text>

<!-- nodes -->
<ellipse id="node-sanctions" cx="480" cy="130" rx="74" ry="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text id="text-sanctions-1" x="480" y="126" font-size="13.5" text-anchor="middle" fill="#000000">sanctions on</text>
<text id="text-sanctions-2" x="480" y="142" font-size="13.5" text-anchor="middle" fill="#000000">the DPRK</text>

<ellipse id="node-access" cx="680" cy="278" rx="92" ry="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text id="text-access-1" x="680" y="274" font-size="13.5" text-anchor="middle" fill="#000000">access to foreign</text>
<text id="text-access-2" x="680" y="290" font-size="13.5" text-anchor="middle" fill="#000000">currency</text>

<ellipse id="node-cyber" cx="610" cy="512" rx="95" ry="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text id="text-cyber-1" x="610" y="508" font-size="13.5" text-anchor="middle" fill="#000000">illicit cyber</text>
<text id="text-cyber-2" x="610" y="524" font-size="13.5" text-anchor="middle" fill="#000000">revenue operations</text>

<ellipse id="node-income" cx="352" cy="512" rx="98" ry="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text id="text-income-1" x="352" y="508" font-size="13.5" text-anchor="middle" fill="#000000">state hard-currency</text>
<text id="text-income-2" x="352" y="524" font-size="13.5" text-anchor="middle" fill="#000000">income</text>

<ellipse id="node-weapons" cx="280" cy="278" rx="98" ry="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text id="text-weapons-1" x="280" y="274" font-size="13.5" text-anchor="middle" fill="#000000">nuclear and missile</text>
<text id="text-weapons-2" x="280" y="290" font-size="13.5" text-anchor="middle" fill="#000000">programme</text>

<ellipse id="node-juche" cx="850" cy="150" rx="96" ry="40" fill="#ffffff" stroke="#8c8c8c" stroke-width="1.5"/>
<text id="text-juche-1" x="850" y="146" font-size="13.5" text-anchor="middle" fill="#8c8c8c">self-reliance</text>
<text id="text-juche-2" x="850" y="162" font-size="13.5" text-anchor="middle" fill="#8c8c8c">policy (juche)</text>

<ellipse id="node-pipeline" cx="852" cy="540" rx="92" ry="40" fill="#ffffff" stroke="#8c8c8c" stroke-width="1.5"/>
<text id="text-pipeline-1" x="852" y="536" font-size="13.5" text-anchor="middle" fill="#8c8c8c">supply of trained</text>
<text id="text-pipeline-2" x="852" y="552" font-size="13.5" text-anchor="middle" fill="#8c8c8c">operators</text>

<!-- loop edges -->
