<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 485" font-family="Helvetica, Arial, sans-serif">
<title>Russian cyber actors on a state-to-crime gradient</title>
<desc>A spectrum of Russian cyber actors from state command on the left to criminal autonomy on the right, with three regions beneath it: directed state operation, tasked-but-independent crew, tolerated free agent. Each actor is drawn as a range on the spectrum rather than a point, the width of the range showing how unevenly the evidence locates it. Sandworm and Fancy Bear sit hard against the state end in narrow bands. Evil Corp spans a wide band across the middle, sitting in neither column. Conti, REvil and LockBit spread toward the criminal end, with Conti reaching back toward the middle where the leaked logs show intelligence interest. The bands overlap and no line divides the spectrum, which is the boundary not holding.</desc>
<rect id="background" x="0" y="0" width="960" height="485" fill="#ffffff"/>
<text id="title" x="480" y="40" font-size="20" text-anchor="middle" fill="#000000">Russia: the boundary that does not hold</text>
<text id="subtitle" x="480" y="63" font-size="13" text-anchor="middle" fill="#000000">A gradient from state command to tolerated crime, with no clean join along it</text>

<!-- actor nodes -->
<ellipse id="node-sandworm" cx="175.5" cy="110" rx="48" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="175.5" y="114.5" font-size="13.5" text-anchor="middle" fill="#000000">Sandworm</text>
<line id="drop-sandworm" x1="175.5" y1="132" x2="175.5" y2="360" stroke="#8c8c8c" stroke-width="0.8"/>
<line id="bar-sandworm" x1="144" y1="360" x2="207" y2="360" stroke="#8c8c8c" stroke-width="5" stroke-linecap="round"/>

<ellipse id="node-fancybear" cx="193" cy="175" rx="56" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="193" y="179.5" font-size="13.5" text-anchor="middle" fill="#000000">Fancy Bear</text>
<line id="drop-fancybear" x1="193" y1="197" x2="193" y2="368" stroke="#8c8c8c" stroke-width="0.8"/>
<line id="bar-fancybear" x1="151" y1="368" x2="235" y2="368" stroke="#8c8c8c" stroke-width="5" stroke-linecap="round"/>

<ellipse id="node-evilcorp" cx="480" cy="110" rx="50" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="480" y="114.5" font-size="13.5" text-anchor="middle" fill="#000000">Evil Corp</text>
<line id="drop-evilcorp" x1="480" y1="132" x2="480" y2="352" stroke="#8c8c8c" stroke-width="0.8"/>
<line id="bar-evilcorp" x1="326" y1="352" x2="634" y2="352" stroke="#8c8c8c" stroke-width="5" stroke-linecap="round"/>

<ellipse id="node-conti" cx="592" cy="240" rx="34" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="592" y="244.5" font-size="13.5" text-anchor="middle" fill="#000000">Conti</text>
<line id="drop-conti" x1="592" y1="262" x2="592" y2="360" stroke="#8c8c8c" stroke-width="0.8"/>
<line id="bar-conti" x1="480" y1="360" x2="704" y2="360" stroke="#8c8c8c" stroke-width="5" stroke-linecap="round"/>

<ellipse id="node-revil" cx="690" cy="175" rx="34" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="690" y="179.5" font-size="13.5" text-anchor="middle" fill="#000000">REvil</text>
<line id="drop-revil" x1="690" y1="197" x2="690" y2="368" stroke="#8c8c8c" stroke-width="0.8"/>
<line id="bar-revil" x1="620" y1="368" x2="760" y2="368" stroke="#8c8c8c" stroke-width="5" stroke-linecap="round"/>

<ellipse id="node-lockbit" cx="781" cy="240" rx="42" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="781" y="244.5" font-size="13.5" text-anchor="middle" fill="#000000">LockBit</text>
<line id="drop-lockbit" x1="781" y1="262" x2="781" y2="352" stroke="#8c8c8c" stroke-width="0.8"/>
<line id="bar-lockbit" x1="739" y1="352" x2="823" y2="352" stroke="#8c8c8c" stroke-width="5" stroke-linecap="round"/>

<!-- spectrum axis -->
<line id="axis" x1="120" y1="380" x2="840" y2="380" stroke="#000000" stroke-width="1.2"/>
<text id="zone-1" x="235" y="400" font-size="12" text-anchor="middle" fill="#000000">directed state operation</text>
<text id="zone-2" x="480" y="400" font-size="12" text-anchor="middle" fill="#000000">tasked-but-independent crew</text>
<text id="zone-3" x="725" y="400" font-size="12" text-anchor="middle" fill="#000000">tolerated free agent</text>

<!-- note -->
<text id="note-1" x="120" y="440" font-size="12.5" fill="#000000">Each grey bar is the span of the spectrum the evidence leaves an actor in; the ellipse marks its centre.</text>
<text id="note-2" x="120" y="457" font-size="12.5" fill="#000000">Overlapping bars, and no dividing line, are the boundary not holding.</text>
</svg>
