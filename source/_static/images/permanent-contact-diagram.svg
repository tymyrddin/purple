<path d="M 279 358 A 25 25 0 1 0 316.5 336.35" fill="none" stroke="#d81e1e" stroke-width="1.6"/>
<polygon points="316.5,336.35 318.7,322.6 327.3,327.6" fill="#d81e1e"/>
<text x="304" y="366" font-size="22" text-anchor="middle" fill="#d81e1e">R</text>

<!-- information loop badge R (clockwise) -->
<path d="M 707 325 A 25 25 0 1 1 694.5 303.35" fill="none" stroke="#d81e1e" stroke-width="1.6"/>
<polygon points="694.5,303.35 683.7,294.6 692.3,289.6" fill="#d81e1e"/>
<text x="682" y="333" font-size="22" text-anchor="middle" fill="#d81e1e">R</text>

<!-- strategic branch -->
<path d="M 393.0 564.0 Q 396.8 607.0 378.1 641.6" fill="none" stroke="#000000" stroke-width="1.6"/>
<polygon points="378.1,641.6 379.8,627.8 388.6,632.5" fill="#000000"/>
<path d="M 403.9 644.6 Q 470.0 620.0 566.0 616.0" fill="none" stroke="#8c8c8c" stroke-width="1.6" stroke-dasharray="6 5"/>

<!-- notes -->
<text x="52" y="748" font-size="12.5" fill="#000000">Two reinforcing loops that close: the operational loop turns adversary activity into intelligence, access, presence, disruption and the shared take; the</text>
<text x="52" y="765" font-size="12.5" fill="#000000">information loop turns the take into defensive products, new telemetry and back to intelligence. The take feeds the system that produced it.</text>

<!-- legend -->
<path d="M 52 810.0 L 80 810.0" fill="none" stroke="#000000" stroke-width="1.6"/>
<polygon points="80,810.0 70,806.0 70,814.0" fill="#000000"/>
<text x="92" y="814.0" font-size="12.5" fill="#000000">documented effect that closes a loop</text>

<path d="M 52 834.0 L 80 834.0" fill="none" stroke="#8c8c8c" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="92" y="838.0" font-size="12.5" fill="#8c8c8c">the strategic edge, which does not close: deter, degrade, contain, or sustain?</text>
</svg>
