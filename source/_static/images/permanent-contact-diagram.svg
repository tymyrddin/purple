<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 852" font-family="Helvetica, Arial, sans-serif">
<title>The US: two loops that close, one edge that does not</title>
<desc>A diagram of effects for American cyber power, drawn as two reinforcing loops that close and one edge that does not. The operational loop turns intelligence into access, access into persistent presence, presence into disruption, disruption into the shared take, and the take back into intelligence. A second loop, the information ecosystem, runs off the shared take: the take reaches partners and industry, becomes defensive products across many endpoints, generates new telemetry, and returns to the shared take. Both loops are drawn solid, meaning documented, and both are reinforcing, marked R. A single open edge leaves disruption toward adversary networks degraded and then rises, dashed, to a question mark without closing: whether continuous contact deters, degrades, contains, or merely sustains a contest both sides get better at. The two loops close; the strategic edge does not.</desc>
<rect id="background" x="0" y="0" width="960" height="852" fill="#ffffff"/>
<text id="title" x="480" y="38" font-size="20" text-anchor="middle" fill="#000000">The US: two loops that close, one edge that does not</text>
<text id="subtitle" x="480" y="60" font-size="13" text-anchor="middle" fill="#000000">An operational loop and an information-ecosystem loop, both reinforcing; the strategic edge stays open</text>

<!-- nodes: operational loop -->
<ellipse cx="300" cy="150" rx="66" ry="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="300" y="154" font-size="13.5" text-anchor="middle" fill="#000000">intelligence</text>
<ellipse cx="140" cy="300" rx="52" ry="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="140" y="304" font-size="13.5" text-anchor="middle" fill="#000000">access</text>
<ellipse cx="190" cy="480" rx="62" ry="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="190" y="476" font-size="13.5" text-anchor="middle" fill="#000000">persistent</text>
<text x="190" y="492" font-size="13.5" text-anchor="middle" fill="#000000">presence</text>
<ellipse cx="390" cy="530" rx="66" ry="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="390" y="534" font-size="13.5" text-anchor="middle" fill="#000000">disruption</text>
<ellipse cx="500" cy="330" rx="70" ry="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="500" y="334" font-size="13.5" text-anchor="middle" fill="#000000">the shared take</text>

<!-- nodes: information loop -->
<ellipse cx="690" cy="165" rx="76" ry="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="690" y="161" font-size="13.5" text-anchor="middle" fill="#000000">partners and</text>
<text x="690" y="177" font-size="13.5" text-anchor="middle" fill="#000000">industry</text>
<ellipse cx="835" cy="320" rx="64" ry="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="835" y="316" font-size="13.5" text-anchor="middle" fill="#000000">defensive</text>
<text x="835" y="332" font-size="13.5" text-anchor="middle" fill="#000000">products</text>
<ellipse cx="705" cy="485" rx="62" ry="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="705" y="481" font-size="13.5" text-anchor="middle" fill="#000000">new</text>
<text x="705" y="497" font-size="13.5" text-anchor="middle" fill="#000000">telemetry</text>

<!-- node: strategic branch -->
<ellipse cx="360" cy="680" rx="98" ry="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="360" y="676" font-size="13.5" text-anchor="middle" fill="#000000">adversary networks</text>
<text x="360" y="692" font-size="13.5" text-anchor="middle" fill="#000000">degraded</text>
<text x="590" y="614" font-size="26" text-anchor="middle" fill="#8c8c8c">?</text>

