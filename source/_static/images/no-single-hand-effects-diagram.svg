<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 678" font-family="Helvetica, Arial, sans-serif">
<title>Lithuania: secure by being useful</title>
<desc>A diagram of effects for Lithuania's cyber posture, drawn as one reinforcing loop with a driver. Exposure without depth drives the state to make its capability useful to the network; that usefulness deepens its embedding in allied and partner structures; the embedding yields security and reach; and the security and reach let it make itself more useful still. The three loop edges run in the same direction, so the loop is reinforcing, marked R and read clockwise, and exposure feeds it from outside. An increase in usefulness to the network raises embedding in allied networks, by human intervention. An increase in embedding in allied networks raises security and reach. An increase in security and reach raises usefulness to the network. An increase in exposure without depth raises usefulness to the network, by human intervention.</desc>
<rect id="background" x="0" y="0" width="960" height="678" fill="#ffffff"/>
<text id="title" x="480" y="38" font-size="20" text-anchor="middle" fill="#000000">Lithuania: secure by being useful</text>
<text id="subtitle" x="480" y="60" font-size="13" text-anchor="middle" fill="#000000">One reinforcing loop, driven by exposure: usefulness buys embedding buys security buys usefulness</text>

<!-- nodes -->
<ellipse cx="480" cy="150" rx="72" ry="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="480" y="146" font-size="13.5" text-anchor="middle" fill="#000000">usefulness to</text>
<text x="480" y="162" font-size="13.5" text-anchor="middle" fill="#000000">the network</text>

<ellipse cx="720" cy="470" rx="85" ry="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="720" y="466" font-size="13.5" text-anchor="middle" fill="#000000">embedding in</text>
<text x="720" y="482" font-size="13.5" text-anchor="middle" fill="#000000">allied networks</text>

<ellipse cx="240" cy="470" rx="65" ry="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="240" y="466" font-size="13.5" text-anchor="middle" fill="#000000">security and</text>
<text x="240" y="482" font-size="13.5" text-anchor="middle" fill="#000000">reach</text>

<ellipse cx="775" cy="225" rx="75" ry="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="775" y="221" font-size="13.5" text-anchor="middle" fill="#000000">exposure</text>
<text x="775" y="237" font-size="13.5" text-anchor="middle" fill="#000000">without depth</text>

<!-- loop -->
<path d="M 524.4 181.5 Q 651.2 271.6 706.3 430.5" fill="none" stroke="#000000" stroke-width="1.6"/>
<polygon points="706.3,430.5 697.3,419.9 706.8,416.6" fill="#000000"/>
<g transform="rotate(53.8 633.3 288.8)"><rect x="626.8" y="282.3" width="13" height="13" fill="#ffffff" stroke="#000000" stroke-width="1.5"/></g>

<path d="M 649.7 492.5 Q 480.0 546.8 297.7 488.5" fill="none" stroke="#000000" stroke-width="1.6"/>
<polygon points="297.7,488.5 311.6,487.7 308.5,497.2" fill="#000000"/>

<path d="M 253.6 430.9 Q 308.8 271.6 435.6 181.5" fill="none" stroke="#000000" stroke-width="1.6"/>
<polygon points="435.6,181.5 427.9,193.1 422.1,185.0" fill="#000000"/>

<!-- reinforcing loop badge -->
<path id="loop-R" d="M 505 363 A 25 25 0 1 1 492.5 341.35" fill="none" stroke="#d81e1e" stroke-width="1.6"/>
<polygon points="492.5,341.35 481.7,332.6 490.3,327.6" fill="#d81e1e"/>
<text x="480" y="371" font-size="22" text-anchor="middle" fill="#d81e1e">R</text>

<!-- driver -->
<path d="M 726.3 194.6 Q 639.5 140.3 551.6 145.6" fill="none" stroke="#000000" stroke-width="1.6"/>
<polygon points="551.6,145.6 564.2,139.9 564.9,149.8" fill="#000000"/>
<g transform="rotate(-164.4 639.2 155.2)"><rect x="632.7" y="148.7" width="13" height="13" fill="#ffffff" stroke="#000000" stroke-width="1.5"/></g>

<!-- notes -->
<text x="52" y="564" font-size="12.5" fill="#000000">One reinforcing loop: exposure drives the state to make its capability useful to the network, usefulness deepens its embedding,</text>
<text x="52" y="581" font-size="12.5" fill="#000000">embedding yields security and reach, and reach funds more usefulness.</text>
<text x="52" y="598" font-size="12.5" fill="#000000">The capability grows more useful as it crosses the border. A small state gains security by refusing to keep cyber power purely national.</text>

<!-- legend -->
<path d="M 52 642.0 L 80 642.0" fill="none" stroke="#000000" stroke-width="1.6"/>
<polygon points="80,642.0 70,638.0 70,646.0" fill="#000000"/>
<text x="92" y="646.0" font-size="12.5" fill="#000000">natural effect, same direction as the movement of the cause</text>

<path d="M 500 642.0 L 528 642.0" fill="none" stroke="#000000" stroke-width="1.6"/>
<polygon points="528,642.0 518,638.0 518,646.0" fill="#000000"/>
<rect x="500.5" y="635.5" width="13" height="13" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="540" y="646.0" font-size="12.5" fill="#000000">human intervention, same direction as the movement of the cause</text>
</svg>
